# On-board bring-up. Paths are relative to your working directory.
# 机器上电，路径均为相对于当前工作目录的相对路径。
# 这一段参数是用于摄像头采集和快照的配置
video_device=auto     // 一般是我们的摄像头设备, auto表示自动选择
width=1280            // 摄像头采集的宽度
height=720            // 摄像头采集的高度
fps=30                // 摄像头采集的帧率
buffers=8             // 缓冲区数量
frames=0              // 采集的帧数 如果为0的话表示一直采集
snapshot=frame.nv12   // 快照文件名

# Optional RKNN detection. Set model after exporting it for rk3568.
# 选择使用RKNN模型进行检测，model参数需要设置为导出的RKNN模型路径
model=                                      // 没有参数 代表现在不使用RKNN模型进行检测
labels=model/coco_80_labels_list.txt        // 使用模型的话 需要设置标签文件路径
event_log=inspection_events.ndjson          // 检测事件日志文件名
use_rga=false                               // 是否使用RGA进行图像缩放，false表示不使用
score_threshold=0.25                        // 置信度阈值
event_threshold=0.60                        // 事件检测阈值
nms_threshold=0.45                          // 非极大值抑制阈值
inference_queue=1                           // 推理队列数量

# Optional MPP output. Set h264_file and/or rtmp_url.
h264_file=                                  // 输出H.264文件路径，如果不需要输出H.264文件可以不设置
rtmp_url=                                   // 输出RTMP流地址，如果不需要输出RTMP流可以不设置
ffmpeg=ffmpeg                               // ffmpeg可执行文件路径
bitrate=2500000                             // H.264编码比特率
stream_queue=2                              // 流队列数量
